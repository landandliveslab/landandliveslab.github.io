---
layout: default
---
<section class="banner banner--image" style="background-image: url('{{ page.banner_image | relative_url }}');">
  <div class="banner__inner">
    <h1>{{ page.banner_title }}</h1>
    {% if page.banner_subtitle %}<p>{{ page.banner_subtitle }}</p>{% endif %}
  </div>
</section>

<div class="wrap">
  <div class="card">
    {{ content }}
    <div class="cta-row">
      <a class="button" href="{{ '/research/' | relative_url }}">Explore our research</a>
      <a class="button button--ghost" href="{{ '/prospective-students/' | relative_url }}">Join the lab</a>
    </div>
  </div>
</div>
