---
layout: default
---
{% if page.banner_title or page.banner_image %}
<section class="banner{% if page.banner_image %} banner--image{% endif %}"
  {% if page.banner_image %}style="background-image: url('{{ page.banner_image | relative_url }}');"{% endif %}>
  <div class="banner__inner">
    {% if page.banner_title %}<h1>{{ page.banner_title }}</h1>{% endif %}
    {% if page.banner_subtitle %}<p>{{ page.banner_subtitle }}</p>{% endif %}
  </div>
</section>
{% endif %}

<div class="wrap">
  <div class="card">
    {% unless page.banner_title %}<h1 class="card__title">{{ page.title }}</h1>{% endunless %}
    {{ content }}
  </div>
</div>
